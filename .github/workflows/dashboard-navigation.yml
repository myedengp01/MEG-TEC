name: Restore dashboard navigation
on:
  push:
    paths:
      - '.github/workflows/dashboard-navigation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add dashboard navigation to live entry point
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="meg-back-to-dashboard"'
          if marker not in s:
              nav='<a id="meg-back-to-dashboard" href="https://myedengp01.github.io/DB-MEG-FORMS/" style="display:inline-block;position:relative;z-index:10000;margin:10px 14px;padding:9px 14px;background:#fff;color:#12365a;border:1px solid #abc3db;border-radius:8px;font:600 14px Arial,sans-serif;text-decoration:none">← Back to Dashboard</a>'
              s,n=re.subn(r'(<body\b[^>]*>)',lambda m:m.group(1)+'\n'+nav, s,count=1,flags=re.I)
              if n!=1: raise SystemExit('No body tag found; no changes made')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit live entry point
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "fix: visible Back to Dashboard navigation (v2026.09.20-09:00)" && git push; fi
